name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mmla_explorer/site/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset URLs with git SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/?v=[A-Za-z0-9_-]*/?v=${SHORT_SHA}/g" mmla_explorer/site/index.html
          echo "Stamped index.html with version ${SHORT_SHA}"
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mmla_explorer/site
          publish_branch: gh-pages
          force_orphan: true
